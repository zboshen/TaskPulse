name: Build macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./scripts/build.sh
      - name: Verify policy and layout calculations
        run: ./dist/TaskPulse.app/Contents/MacOS/TaskPulse --self-test
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TaskPulse-macOS
          path: |
            dist/TaskPulse.dmg
            dist/TaskPulse.zip
            dist/SHA256SUMS.txt
